spring:
  application:
    name: fpl-data-ingestor
  datasource:
    url: jdbc:h2:mem:fpl;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

app:
  version: ${APP_VERSION:dev}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fpl}
    username: ${DATABASE_USERNAME:fpl}
    password: ${DATABASE_PASSWORD:fpl}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
